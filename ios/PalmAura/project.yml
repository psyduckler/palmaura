name: PalmAura
options:
  bundleIdPrefix: com.zonted
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  PalmAura:
    type: application
    platform: iOS
    sources:
      - PalmAura
    resources:
      - PalmAura/Resources
    info:
      path: PalmAura/Info.plist
      properties:
        CFBundleDisplayName: PalmAura
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: PalmAura uses your camera to capture your palm for an entertainment-only reading.
        NSPhotoLibraryUsageDescription: PalmAura uses your photo library to choose a palm photo for an entertainment-only reading.
        NSPhotoLibraryAddUsageDescription: PalmAura saves your share card to your photo library when you tap Save.
        LSApplicationQueriesSchemes:
          - instagram-stories
        UIAppFonts:
          - CormorantGaramond.ttf
          - CormorantGaramond-Italic.ttf
          - EBGaramond.ttf
          - EBGaramond-Italic.ttf
          - Cinzel.ttf
          - Caveat.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zonted.palmaura
        INFOPLIST_FILE: PalmAura/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PalmAuraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PalmAuraTests
    info:
      path: PalmAuraTests/Info.plist
      properties:
        CFBundleIdentifier: com.zonted.palmauraTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PalmAura
