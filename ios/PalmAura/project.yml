name: PalmAura
options:
  bundleIdPrefix: app.palmaura
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PalmAura:
    type: application
    platform: iOS
    sources:
      - PalmAura
    resources:
      - PalmAura/Resources
    info:
      path: PalmAura/Info.plist
      properties:
        CFBundleDisplayName: PalmAura
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: PalmAura uses your camera to capture your palm for an entertainment-only reading.
        NSPhotoLibraryUsageDescription: PalmAura uses your photo library to choose a palm photo for an entertainment-only reading.
        # Required to call UIImageWriteToSavedPhotosAlbum when the user
        # taps "Save to Photos" on the share card. Without this key iOS
        # will crash the app on the save call.
        NSPhotoLibraryAddUsageDescription: PalmAura saves your aura share card to your photo library when you choose Save.
        # Declares the app uses only standard/exempt encryption (HTTPS via
        # URLSession). Skips the export-compliance prompt on every
        # TestFlight upload — required for smooth release-train velocity.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - CormorantGaramond.ttf
          - CormorantGaramond-Italic.ttf
          - EBGaramond.ttf
          - EBGaramond-Italic.ttf
          - Cinzel.ttf
          - Caveat.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.palmaura
        INFOPLIST_FILE: PalmAura/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  PalmAuraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PalmAuraTests
    info:
      path: PalmAuraTests/Info.plist
      properties:
        CFBundleIdentifier: app.palmaura.tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PalmAura
