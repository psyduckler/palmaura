name: PalmAura
options:
  bundleIdPrefix: app.palmaura
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PalmAura:
    type: application
    platform: iOS
    sources:
      - PalmAura
    resources:
      - PalmAura/Resources
    info:
      path: PalmAura/Info.plist
      properties:
        CFBundleDisplayName: PalmAura
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSCameraUsageDescription: PalmAura uses your camera to capture your palm for an entertainment-only reading.
        NSPhotoLibraryUsageDescription: PalmAura uses your photo library to choose a palm photo for an entertainment-only reading.
        LSApplicationQueriesSchemes:
          - instagram-stories
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.palmaura.PalmAura
        INFOPLIST_FILE: PalmAura/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PalmAuraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PalmAuraTests
    info:
      path: PalmAuraTests/Info.plist
      properties:
        CFBundleIdentifier: app.palmaura.PalmAuraTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PalmAura
